<html lang="en">
<head>

	<style>
		:root {
			--primary: #FF006E;
			--secondary: #3A86FF;
			--accent: #FFBE0B;
			--bg: #050816;
			--panel: rgba(8, 12, 24, .94);
			--glass: rgba(255, 255, 255, .06);
			--line: rgba(255, 255, 255, .18);
			--cyan: #63F2FF;
			--blue: #5DA8FF;
			--violet: #8A7BFF;
			--white: #FFF;
			--shadow: 0 25px 70px rgba(0, 0, 0, .6)
		}

		* { box-sizing: border-box; margin: 0; padding: 0 }

		body, html {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: #fff;
			font-family: 'Roboto Mono', monospace;
			user-select: none;
			-webkit-tap-highlight-color: transparent
		}

		canvas { display: block }

		#canvas-container {
			position: fixed;
			inset: 0;
			z-index: 1;
			cursor: grab
		}

		#canvas-container.pointer-cursor,
		canvas.pointer-cursor { cursor: pointer }

		#brand-header {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 14px 24px;
			background: linear-gradient(180deg, rgba(5, 8, 22, .94), transparent);
			pointer-events: none
		}

		.brand-left {
			display: flex;
			gap: 12px;
			align-items: center;
			pointer-events: auto
		}

		.brand-face {
			width: 46px;
			height: 46px;
			border-radius: 50%;
			object-fit: cover;
			border: 2px solid rgba(255, 255, 255, .4);
			box-shadow: 0 0 28px var(--accent);
			animation: face 6s ease-in-out infinite
		}

		@keyframes face {
			0%, 100% { transform: translateY(0) rotate(0) scale(1) }
			25% { transform: translateY(-7px) rotate(4deg) scale(1.06) }
			50% { transform: translateY(4px) rotate(-4deg) scale(.97) }
			75% { transform: translateY(-2px) rotate(2deg) scale(1.03) }
		}

		.brand-title {
			font-family: 'Playfair Display';
			font-size: 1.6rem;
			font-weight: 700;
			background: linear-gradient(90deg, var(--primary), var(--cyan), var(--violet), var(--accent));
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent
		}

		.brand-subtitle {
			font-size: .7rem;
			color: var(--accent);
			letter-spacing: 2px;
			text-transform: uppercase
		}

		.nav {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			pointer-events: auto;
			align-items: center
		}

		.env-btn, .nav button, .switcher {
			font-family: Orbitron;
			font-size: .72rem;
			border: 1px solid var(--line);
			background: var(--glass);
			color: #fff;
			border-radius: 999px;
			padding: 9px 13px;
			cursor: pointer;
			backdrop-filter: blur(12px);
			text-decoration: none;
			transition: all .3s ease
		}

		.env-btn:hover, .nav button:hover, .switcher:hover {
			background: var(--cyan);
			border-color: var(--cyan);
			color: #000;
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(99, 242, 255, .3)
		}

		#hint {
			position: fixed;
			bottom: 24px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 15;
			color: rgba(255, 255, 255, .75);
			font-family: Orbitron;
			font-size: .74rem;
			letter-spacing: 1.8px;
			text-shadow: 0 0 14px var(--cyan);
			pointer-events: none;
			text-align: center;
			animation: pulse 2.5s infinite
		}

		@keyframes pulse {
			0%, 100% { opacity: .4 }
			50% { opacity: 1 }
		}

		#overlay {
			position: fixed;
			inset: 0;
			z-index: 60;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, .66);
			backdrop-filter: blur(8px);
			opacity: 0;
			pointer-events: none;
			transition: .3s
		}

		#overlay.active {
			opacity: 1;
			pointer-events: auto
		}

		#panel {
			width: min(1080px, 93vw);
			max-height: 86vh;
			overflow: auto;
			background: var(--panel);
			border: 1px solid rgba(255, 255, 255, .15);
			border-radius: 18px;
			padding: 28px;
			box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, .05);
			backdrop-filter: blur(28px);
			position: relative
		}

		#panel::before {
			content: '';
			position: absolute;
			inset: -2px;
			border-radius: 20px;
			padding: 2px;
			background: linear-gradient(135deg, var(--cyan), var(--violet), var(--blue), var(--cyan));
			background-size: 300% 300%;
			animation: borderSweep 4s ease infinite;
			-webkit-mask: linear-gradient(#fff, #fff) content-box, linear-gradient(#fff, #fff);
			mask: linear-gradient(#fff, #fff) content-box, linear-gradient(#fff, #fff);
			-webkit-mask-composite: xor;
			mask-composite: exclude;
			z-index: -1;
			pointer-events: none
		}

		@keyframes borderSweep {
			0%, 100% { background-position: 0 50% }
			25% { background-position: 100% 0 }
			50% { background-position: 100% 100% }
			75% { background-position: 0 100% }
		}

		#close {
			position: sticky;
			top: 0;
			float: right;
			width: 42px;
			height: 42px;
			border: 0;
			border-radius: 50%;
			font-size: 28px;
			background: rgba(255, 255, 255, .12);
			color: #fff;
			cursor: pointer;
			z-index: 2
		}

		#close:hover {
			background: var(--primary);
			transform: rotate(90deg)
		}

		.modal-title {
			font-family: 'Playfair Display';
			font-size: clamp(1.8rem, 4vw, 3rem);
			background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent
		}

		.modal-subtitle {
			color: var(--accent);
			font-family: Orbitron;
			font-size: .85rem;
			letter-spacing: 2px;
			margin: 5px 0 18px;
			padding-bottom: 12px;
			border-bottom: 1px solid rgba(255, 255, 255, .12)
		}

		.modal-body {
			font-family: Lato;
			line-height: 1.7;
			color: rgba(255, 255, 255, .86)
		}

		.subsection-kicker {
			font-family: Orbitron;
			font-size: 0.75rem;
			letter-spacing: 2px;
			color: var(--cyan);
			margin-top: 24px;
			margin-bottom: 6px;
			text-transform: uppercase;
		}

		.subsection-title {
			font-family: 'Playfair Display';
			font-size: 1.45rem;
			color: #fff;
			margin-bottom: 10px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.badge {
			font-family: Orbitron;
			font-size: 0.65rem;
			letter-spacing: 1px;
			text-transform: uppercase;
			color: #000;
			background: var(--accent);
			border-radius: 999px;
			padding: 4px 10px;
		}

		.cards {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 16px;
			margin-top: 16px
		}

		.card {
			background: rgba(255, 255, 255, .04);
			border: 1px solid rgba(255, 255, 255, .12);
			border-radius: 14px;
			padding: 18px;
			backdrop-filter: blur(12px);
			transition: all .3s ease
		}

		.card:hover {
			border-color: var(--cyan);
			transform: translateY(-3px);
			box-shadow: 0 12px 28px rgba(99, 242, 255, .15)
		}

		.card h3 {
			font-family: 'Playfair Display';
			margin-bottom: 8px;
			font-size: 1.2rem;
		}

		.card p, .card div {
			font-family: Lato;
			font-size: .92rem;
			line-height: 1.55;
			color: rgba(255, 255, 255, .84);
		}

		.ico {
			width: 42px;
			height: 42px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, var(--cyan), var(--violet));
			font-size: 20px;
			margin-bottom: 10px
		}

		.links {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 14px
		}

		.links a {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			padding: 8px 13px;
			border-radius: 8px;
			background: rgba(255, 255, 255, .06);
			border: 1px solid rgba(255, 255, 255, .2);
			color: #fff;
			text-decoration: none;
			font-family: Lato;
			font-size: .85rem;
			font-weight: 700;
			cursor: pointer;
			min-height: 36px;
			backdrop-filter: blur(6px);
			transition: all .2s ease;
		}

		.links a:hover {
			background: var(--cyan);
			color: #000
		}

		@media (max-width:860px) {
			.nav { display: none }
			.brand-title { font-size: 1.15rem }
			#panel { padding: 18px 14px }
			#hint { font-size: .62rem; width: 92%; white-space: normal }
		}

/* === Adaptive Modal Card Grids (Patch) === */
/* === Adaptive Modal Card Grids (Patch 2) === */
#panel .cards {
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
}
#panel .cards > * {
	min-width: 0;
}
#panel .cards > .card-span-2 { grid-column: span 2; }
#panel .cards > .card-span-3 { grid-column: span 3; }
#panel .cards > .card-span-full { grid-column: 1 / -1; }
#panel .cards.grid-center-last {
	display: flex !important;
	flex-wrap: wrap !important;
	justify-content: center !important;
	align-items: stretch !important;
}
#panel .cards.grid-center-last > * {
	flex: 1 1 min(100%, 250px);
	max-width: min(100%, 440px);
	min-width: 0;
}
@media (max-width: 640px), (orientation: portrait) and (max-width: 768px) {
	#panel .cards > [class*="card-span-"] {
		grid-column: 1 / -1 !important;
	}
}
/* === Friendly Rounded Corners & Balanced Spacing (Patch 3) === */
#panel .cards {
	gap: clamp(14px, 1.8vw, 24px);
}

#panel .card {
	border-radius: 18px !important;
}

#panel .links a {
	border-radius: 10px;
}

@media (max-width: 640px) {
	#panel .card {
		border-radius: 15px !important;
	}
}

	
/* === All-in-One Modal Card Row Layout (Patch All) === */
#panel .cards.cols-equal-3 {
	grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
}

#panel .cards.cards-centered-2 {
	display: flex !important;
	flex-wrap: wrap !important;
	justify-content: center !important;
	align-items: stretch !important;
}

#panel .cards.cards-centered-2 > * {
	flex: 0 1 min(400px, calc(50% - 16px));
	min-width: min(100%, 250px);

}

@media (max-width: 900px), (orientation: portrait) and (max-width: 768px) {
	#panel .cards.cols-equal-3 {
		grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)) !important;
	}
}

@media (max-width: 720px), (orientation: portrait) and (max-width: 768px) {
	#panel .cards.cards-centered-2 {

	}

	#panel .cards.cards-centered-2 > * {
		flex: none !important;
		max-width: none !important;
	}
}

			Object.keys(row).forEach(k => { map[normKey(k)] = row[k]; });
			for(const k of keys){ const v = map[normKey(k)]; if(v !== undefined && v !== null && v !== '') return v; }
			for(const k of keys){ const v = map[normKey(k)]; if(v !== undefined && v !== null) return v; }
			return '';
		}
		function normalizeResumeRow(r){
			return {
				DocId:        safeText(pick(r,'DocId','Id','Key')),
				Label:        safeText(pick(r,'Label','Tab','Name')),
				Title:        safeText(pick(r,'Title')),
				Description:  safeText(pick(r,'Description','Desc','Body')),
				URL:          safeText(pick(r,'URL','FileURL','PdfURL')),
				URL_HTML:     safeText(pick(r,'URL_HTML','URLHTML','HTMLURL')),
				DownloadName: safeText(pick(r,'DownloadName','FileName')),
				Icon:         safeText(pick(r,'Icon')),
				Order:        pick(r,'Order'),
				Visible:      pick(r,'Visible')

		}
		function htmlUrl(doc){
			const raw = safeText(doc && doc.URL_HTML).trim();

		function isVisible(val) {
			return String(val ?? 'TRUE').trim().toUpperCase() !== 'FALSE';

		async function loadExcelData() {
			try {
				const response = await fetch(XLSX_URL);
				if (!response.ok) throw new Error(`HTTP ${response.status} loading ${XLSX_URL}`);
				const arrayBuffer = await response.arrayBuffer();
				const workbook = XLSX.read(arrayBuffer, { type: 'array' });

				const getSheet = name => {
					const ws = workbook.Sheets[name];
					return ws ? XLSX.utils.sheet_to_json(ws, { defval: '' }) : [];
				};

				GBNfoData.themes = getSheet('Themes').filter(t=>isVisible(t.Visible)).sort((a,b)=>(Number(a.Order)||99)-(Number(b.Order)||99));
				GBNfoData.announcements = getSheet('Announcements').filter(activeAnnouncement).sort((a,b)=>(Number(a.Order)||99)-(Number(b.Order)||99));
				GBNfoData.settings = getSheet('Settings').reduce((o,r)=>(r.Key&&(o[String(r.Key).trim()]=r.Value),o),{});
				GBNfoData.environments = getSheet('Environments3D').filter(e=>isVisible(e.Visible)).sort((a,b)=>(Number(a.Order)||99)-(Number(b.Order)||99));
				GBNfoData.site = getSheet('Site').reduce((acc, row) => {
					if (row.Key) acc[String(row.Key).trim()] = row.Value;
					return acc;
				}, {});
				GBNfoData.nav = getSheet('Navigation').filter(n => isVisible(n.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));
				GBNfoData.sections = getSheet('Sections').filter(s => isVisible(s.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));
				GBNfoData.groups = getSheet('Groups').filter(g => isVisible(g.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));
				GBNfoData.cards = getSheet('Cards').filter(c => isVisible(c.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));
				GBNfoData.links = getSheet('Links').filter(l => isVisible(l.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));
				GBNfoData.resume = getSheet('Resume').map(normalizeResumeRow).filter(r => isVisible(r.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));
				GBNfoData.social = getSheet('Social').filter(s => isVisible(s.Visible)).sort((a, b) => (Number(a.Order) || 99) - (Number(b.Order) || 99));

				buildStationData();
				populateNavFromExcel();
				populateEnvironmentSwitcher();
				applyWorkbookTheme3D();
				window.app?.announcementSystem?.setRows(GBNfoData.announcements, GBNfoData.settings);
			} catch (err) {
				console.error('Excel load error:', err);
			}
		}

		function buildCard(c) {
			return {
				icon: c.Icon || '✨',
				title: c.Title || '',
				desc: c.Body || '',
				badge: c.Badge || '', layout: c.Layout || 'card', iconType: c.IconType || 'emoji',
				links: GBNfoData.links
					.filter(l => String(l.CardId).trim() === String(c.CardId).trim())
					.map(l => ({
						text: l.Label || 'Open',
						url: l.URL || '#',
						download: String(l.Target||'').toLowerCase()==='download'||String(l.Label||'').toLowerCase().includes('download'),
						target: l.Target || '_blank', icon: l.Icon || ''
					}))
			};
		}

		function buildStationData() {
			if (GBNfoData.site.SiteTitle) {
				document.title = GBNfoData.site.SiteTitle;
				document.getElementById('brand-title').textContent = String(GBNfoData.site.SiteTitle).split('·')[0].trim();
			}
			if (GBNfoData.site.SiteDescription) {
				document.getElementById('brand-subtitle').textContent = GBNfoData.site.SiteDescription;
			}
			if (GBNfoData.site.LogoURL) {
				document.getElementById('brand-logo').src = GBNfoData.site.LogoURL;
			}

			GBNfoData.sections.forEach(sec => {
				const secId = String(sec.SectionId).trim();
				const secCards = GBNfoData.cards.filter(c => String(c.SectionId).trim() === secId);
				const secGroups = GBNfoData.groups.filter(g => String(g.SectionId).trim() === secId);

				const station = {
					title: sec.Title || secId,
					subtitle: sec.Subtitle || '',
					body: sec.Body ? `<p>${sec.Body}</p>` : '',
					groups: [],
					looseCards: []
				};

				if (secId === 'resume') {
					station.looseCards = GBNfoData.resume.map(r => ({
						icon: r.Icon || '📄',
						title: r.Label || '',
						desc: r.Description || '',
						links: [
							...(r.URL ? [{ text: 'View File', url: r.URL }, { text: 'Download', url: r.URL, download: true }] : []),
							...(htmlUrl(r) ? [{ text: 'Open HTML', url: htmlUrl(r), target: '_blank', icon: 'fas fa-code' }] : [])
						]
					}));
					stationData[secId] = station;
					return;
				}

				if (secId === 'contact') {
					const stCards = secCards.map(c => buildCard(c));
					GBNfoData.social.forEach(s => {
						stCards.push({
							icon: s.Icon || '🔗',
							title: s.Label || 'Social',
							desc: s.Description || '',
							links: s.URL ? [{ text: s.Label || 'Open', url: s.URL }] : []
						});
					});
					station.looseCards = stCards;
					stationData[secId] = station;
					return;
				}

				const groupedCardIds = new Set();
				secGroups.forEach(g => {
					const gId = String(g.GroupId).trim();
					const gCards = secCards.filter(c => String(c.GroupId).trim() === gId);
					if (gCards.length > 0) {
						station.groups.push({
							kicker: g.Kicker || '',
							title: g.Title || '',
							badge: g.Badge || '',
							cards: gCards.map(c => buildCard(c))
						});
						gCards.forEach(c => groupedCardIds.add(String(c.CardId).trim()));
					}
				});

				station.looseCards = secCards
					.filter(c => !groupedCardIds.has(String(c.CardId).trim()))
					.map(c => buildCard(c));

				stationData[secId] = station;
			});

			// Build fallback Link Vault from Excel if not explicitly defined as a section
			if (!stationData.linkvault) {
				stationData.linkvault = {
					title: 'Classic Link Vault',
					subtitle: 'Quick-access links from GBNfo.xlsx',
					body: '<p>Direct access to documents, demos, and channels.</p>',
					groups: [],
					looseCards: [
						{
							icon: '📄',
							title: 'CVs & Documents',
							desc: 'Direct links from the Resume sheet.',
							links: GBNfoData.resume.flatMap(r => { const out = []; if (r.URL) out.push({ text: r.Label, url: r.URL, target: '_blank' }); const hUrl = htmlUrl(r); if (hUrl) out.push({ text: r.Label + ' (HTML)', url: hUrl, target: '_blank', icon: 'fas fa-code' }); return out; })
						},
						{
							icon: '🔗',
							title: 'Social & Channels',
							desc: 'Profiles and audio/visual links.',
							links: GBNfoData.social.map(s => ({ text: s.Label, url: s.URL }))
						}
					]
				};
			}
		}

		function populateNavFromExcel() {
			const navContainer = document.getElementById('nav-container');
			const envSelect = document.getElementById('env-switcher');

			// Inject section modal buttons directly from Excel Navigation sheet
			GBNfoData.nav.filter(n => String(n.Style).trim().toLowerCase() !== 'switcher').forEach(item => {
				const targetId = String(item.Link || '').replace('#', '').trim();
				if (!targetId) return;
				const btn = document.createElement('button');

		function populateEnvironmentSwitcher(){ const sel=document.getElementById('env-switcher'); if(!GBNfoData.environments?.length)return; sel.replaceChildren(...GBNfoData.environments.map(e=>{const o=document.createElement('option');o.value=e.Key;o.textContent=e.Label||e.Key;return o;})); sel.value=GBNfoData.settings.DefaultEnvironment||GBNfoData.environments[0].Key; window.app?.envManager?.switchTo(sel.value); }
		function applyWorkbookTheme3D(){ const key=GBNfoData.site.DefaultTheme, t=GBNfoData.themes?.find(x=>String(x.Key)===String(key))||GBNfoData.themes?.[0]; if(!t)return; const r=document.documentElement.style;r.setProperty('--primary',t.Primary);r.setProperty('--secondary',t.Secondary);r.setProperty('--accent',t.Accent); }
		function renderLinks(links) {

			).join('')}</div>`;

				<div class="modal-body">${d.body || ''}</div>`;

		/* =========================================================
		   2. PERLIN NOISE UTILITY
		   ========================================================= */
		class Perlin {
			constructor() {
				this.p = new Uint8Array(512);
				this.perm = new Uint8Array(512);
				for (let i = 0; i < 256; i++) this.p[i] = i;
				for (let i = 255; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[this.p[i], this.p[j]] = [this.p[j], this.p[i]];
				}
				for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
			}
			fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
			lerp(a, b, t) { return a + t * (b - a); }
			grad(hash, x, y, z) {
				const h = hash & 15;
				const u = h < 8 ? x : y;
				const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
				return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
			}
			noise(x, y, z) {
				const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
				x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
				const u = this.fade(x), v = this.fade(y), w = this.fade(z);
				const A = this.perm[X] + Y, AA = this.perm[A] + Z, AB = this.perm[A + 1] + Z;
				const B = this.perm[X + 1] + Y, BA = this.perm[B] + Z, BB = this.perm[B + 1] + Z;
				return this.lerp(
					this.lerp(this.lerp(this.grad(this.perm[AA], x, y, z), this.grad(this.perm[BA], x - 1, y, z), u),
						this.lerp(this.grad(this.perm[AB], x, y - 1, z), this.grad(this.perm[BB], x - 1, y - 1, z), u), v),
					this.lerp(this.lerp(this.grad(this.perm[AA + 1], x, y, z - 1), this.grad(this.perm[BA + 1], x - 1, y, z - 1), u),
						this.lerp(this.grad(this.perm[AB + 1], x, y - 1, z - 1), this.grad(this.perm[BB + 1], x - 1, y - 1, z - 1), u), v), w
				);
			}
		}
		const perlin = new Perlin();

		class EnvironmentManager {
			constructor(scene) {
				this.scene = scene;
				this.mesh = null;
				this.current = 'penthouse';
				const geo = new THREE.SphereGeometry(90, 64, 32);
				const mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, depthWrite: false });
				this.mesh = new THREE.Mesh(geo, mat);
				this.mesh.renderOrder = -10;
				this.scene.add(this.mesh);
				this.apply('penthouse');
			}
			drawCanvas(type) {
				const c = document.createElement('canvas');
				c.width = 2048; c.height = 1024;
				const x = c.getContext('2d');
				const palettes = {
					penthouse: [['#0a0a12', 0], ['#1a1520', 0.4], ['#151018', 0.7], ['#080510', 1]],
					ocean: [['#000810', 0], ['#001830', 0.3], ['#002850', 0.6], ['#001020', 1]],
					city: [['#020208', 0], ['#0a0a18', 0.5], ['#101020', 0.8], ['#080810', 1]],
					rooftop: [['#000000', 0], ['#050510', 0.3], ['#0a0a18', 0.7], ['#020205', 1]],
					sunset: [['#1a0a20', 0], ['#4a1a30', 0.3], ['#8b3a2a', 0.6], ['#2a1018', 1]]
				};
				const stops = palettes[type] || palettes.penthouse;
				const g = x.createLinearGradient(0, 0, 0, 1024);
				stops.forEach(s => g.addColorStop(s[1], s[0]));
				x.fillStyle = g;
				x.fillRect(0, 0, 2048, 1024);

				for (let i = 0; i < 240; i++) {
					x.fillStyle = `rgba(255,255,255,${0.15 + Math.random() * 0.55})`;
					const s = Math.random() * 2.2 + 0.6;
					x.fillRect(Math.random() * 2048, Math.random() * 520, s, s);
				}

				const drawMountains = (base, color, amp, seed) => {
					x.beginPath();
					x.moveTo(0, 1024);
					for (let px = 0; px <= 2048; px += 18) {
						const y = base + Math.sin(px * 0.006 + seed) * amp + Math.sin(px * 0.017 + seed * 2) * amp * 0.35;
						x.lineTo(px, y);
					}
					x.lineTo(2048, 1024);
					x.closePath();
					x.fillStyle = color;
					x.fill();
				};

				if (type === 'penthouse' || type === 'sunset' || type === 'rooftop') {
					drawMountains(690, type === 'sunset' ? 'rgba(45,16,36,.72)' : 'rgba(12,16,34,.72)', 38, 1.7);
					drawMountains(760, 'rgba(5,8,18,.88)', 32, 4.1);
				}
				if (type === 'sunset') {
					const sun = x.createRadialGradient(1024, 650, 30, 1024, 650, 250);
					sun.addColorStop(0, 'rgba(255,200,80,0.5)');
					sun.addColorStop(0.5, 'rgba(255,100,60,0.2)');
					sun.addColorStop(1, 'rgba(0,0,0,0)');
					x.fillStyle = sun;
					x.fillRect(0, 0, 2048, 1024);
				}
				if (type === 'ocean') {
					const moon = x.createRadialGradient(1520, 260, 5, 1520, 260, 120);
					moon.addColorStop(0, 'rgba(230,250,255,.68)');
					moon.addColorStop(1, 'rgba(230,250,255,0)');
					x.fillStyle = moon;
					x.fillRect(1320, 80, 420, 360);
					for (let j = 0; j < 46; j++) {
						x.strokeStyle = `rgba(99,242,255,${0.05 + Math.random() * 0.08})`;
						x.lineWidth = 1 + Math.random() * 3;
						x.beginPath();
						const y = 620 + j * 8;
						x.moveTo(0, y);
						for (let px = 0; px < 2048; px += 32) x.lineTo(px, y + Math.sin(px * .013 + j * .7) * 10);
						x.stroke();
					}
				}
				if (type === 'city' || type === 'rooftop') {
					for (let i = 0; i < 95; i++) {
						const bw = 18 + Math.random() * 72, bh = 90 + Math.random() * 330;
						const bx = Math.random() * 2048, by = 820 - bh + Math.random() * 90;
						x.fillStyle = `rgba(${8 + Math.random() * 18},${10 + Math.random() * 20},${28 + Math.random() * 45},.92)`;
						x.fillRect(bx, by, bw, bh);
						x.fillStyle = `rgba(255,190,80,${.16 + Math.random() * .34})`;
						for (let wx = 6; wx < bw - 6; wx += 12)
							for (let wy = 12; wy < bh - 10; wy += 18)
								if (Math.random() > .48) x.fillRect(bx + wx, by + wy, 5, 8);
					}
				}
				return new THREE.CanvasTexture(c);
			}
			apply(name) {
				this.mesh.material.map = this.drawCanvas(name);
				this.mesh.material.needsUpdate = true;
				const fogColors = { penthouse: '#080510', ocean: '#000810', city: '#020208', rooftop: '#020205', sunset: '#1a0a20' };
				this.scene.fog.color.set(fogColors[name] || '#050816');
				this.current = name;
			}
			switchTo(name) { this.apply(name); }
		}

		class ScenicBackdropSystem {
			constructor(scene) {
				this.scene = scene;
				this.panels = [];
				const kinds = ['islands', 'city', 'volcano', 'jungle', 'wonder'];
				for (let i = 0; i < 10; i++) {
					const kind = kinds[i % kinds.length];
					const tex = this.makePhotoTexture(kind, i + 1);
					tex.colorSpace = THREE.SRGBColorSpace;
					const mat = new THREE.MeshBasicMaterial({
						map: tex, transparent: true, opacity: .82, side: THREE.DoubleSide, depthWrite: false
					});
					const mesh = new THREE.Mesh(new THREE.PlaneGeometry(30, 15), mat);
					const angle = (i / 10) * Math.PI * 2;
					const r = 62;
					mesh.position.set(Math.cos(angle) * r, 9 + (i % 3) * 1.5, Math.sin(angle) * r);
					mesh.lookAt(0, 6, 0);
					mesh.renderOrder = -4;
					this.scene.add(mesh);
					this.panels.push({ mesh, baseY: mesh.position.y });
				}
			}
			makePhotoTexture(kind) {
				const c = document.createElement('canvas');
				c.width = 1024; c.height = 512;
				const x = c.getContext('2d');
				const palettes = {
					islands: ['#05192d', '#12647a', '#f7b267'],
					city: ['#090a18', '#1c2448', '#ffc857'],

		class FloorSystem {
			constructor(scene) {
				this.scene = scene;
				this.ripples = [];
				this.bursts = [];
				const geo = new THREE.PlaneGeometry(100, 100, 120, 120);
				geo.rotateX(-Math.PI / 2);
				this.basePos = new Float32Array(geo.attributes.position.array);
				this.floorGeo = geo;

				this.floorCanvas = document.createElement('canvas');
				this.floorCanvas.width = this.floorCanvas.height = 768;
				this.fctx = this.floorCanvas.getContext('2d');
				this.floorTex = new THREE.CanvasTexture(this.floorCanvas);
				this.floorTex.wrapS = this.floorTex.wrapT = THREE.RepeatWrapping;

				const mat = new THREE.MeshStandardMaterial({
					map: this.floorTex, color: '#ffffff', roughness: 0.35, metalness: 0.45,
					emissive: '#050505', emissiveIntensity: 0.16, side: THREE.DoubleSide
				});
				this.mesh = new THREE.Mesh(geo, mat);
				this.mesh.receiveShadow = true;
				this.scene.add(this.mesh);

				const grid = new THREE.GridHelper(100, 100, '#63F2FF', '#1a2840');
				grid.position.y = 0.01;
				grid.material.transparent = true;
				grid.material.opacity = 0.25;
				this.scene.add(grid);
			}
			drawFloorTexture(t) {
				const g = this.fctx.createRadialGradient(384 + Math.sin(t * 0.35) * 130, 330 + Math.cos(t * 0.28) * 110, 10, 384, 384, 570);
				g.addColorStop(0, `hsl(${(t * 45) % 360},90%,35%)`);
				g.addColorStop(0.35, `hsl(${(t * 45 + 90) % 360},88%,20%)`);
				g.addColorStop(0.7, `hsl(${(t * 45 + 180) % 360},90%,12%)`);
				g.addColorStop(1, '#030306');
				this.fctx.fillStyle = g;
				this.fctx.fillRect(0, 0, 768, 768);
				for (let i = 0; i < 22; i++) {
					this.fctx.strokeStyle = `hsla(${(t * 70 + i * 19) % 360},95%,60%,.12)`;
					this.fctx.lineWidth = 1 + i % 3;
					this.fctx.beginPath();
					const y = (i * 41 + t * 35) % 768;
					this.fctx.moveTo(0, y);
					for (let x = 0; x < 768; x += 24) this.fctx.lineTo(x, y + Math.sin(x * 0.016 + t + i) * 18);
					this.fctx.stroke();
				}
				this.floorTex.needsUpdate = true;
			}
			addRipple(x, z, strength = 0.7) { this.ripples.push({ x, z, t: 0, str: strength }); }
			addBurst(x, z) { this.bursts.push({ x, z, t: 0 }); }
			update(time, dt) {
				const arr = this.floorGeo.attributes.position.array;
				for (let i = 0; i < arr.length; i += 3) {
					const ox = this.basePos[i], oz = this.basePos[i + 2];
					let y = perlin.noise(ox * 0.08, oz * 0.08, time * 0.2) * 0.35;
					y += perlin.noise(ox * 0.15 + 100, oz * 0.15, time * 0.35) * 0.18;
					y += Math.sin(ox * 0.45 + time * 1.3) * 0.05 + Math.cos(oz * 0.38 + time * 0.9) * 0.05;
					for (const r of this.ripples) {
						const d = Math.hypot(ox - r.x, oz - r.z);
						y += Math.sin(d * 3.0 - r.t * 10) * Math.exp(-d * 0.45) * Math.max(0, 1 - r.t / 2.2) * r.str * 0.3;
					}
					for (const b of this.bursts) {
						const d = Math.hypot(ox - b.x, oz - b.z);
						y += Math.exp(-d * d * 0.3) * Math.sin(b.t * 14) * Math.max(0, 1 - b.t / 1.2) * 1.3;
					}
					arr[i + 1] = y;
				}
				this.floorGeo.attributes.position.needsUpdate = true;
				for (let i = this.ripples.length - 1; i >= 0; i--) { this.ripples[i].t += dt; if (this.ripples[i].t > 2.2) this.ripples.splice(i, 1); }
				for (let i = this.bursts.length - 1; i >= 0; i--) { this.bursts[i].t += dt; if (this.bursts[i].t > 1.2) this.bursts.splice(i, 1); }
				this.drawFloorTexture(time);
			}
		}

		class CeilingSystem {
			constructor(scene) {
				this.scene = scene;
				this.nodeCount = 750;
				this.edgeCount = 1200;
				this.packetCount = 45;
				const dummy = new THREE.Object3D();
				this.nodeMesh = new THREE.InstancedMesh(
					new THREE.SphereGeometry(0.12, 8, 6),
					new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x222222, emissiveIntensity: 0.6, roughness: 0.3 }),
					this.nodeCount
				);
				this.nodeMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
				this.scene.add(this.nodeMesh);

				this.nodes = [];
				for (let i = 0; i < this.nodeCount; i++) {
					const angle = Math.random() * Math.PI * 2, radius = 8 + Math.random() * 22, y = 12 + Math.random() * 10;
					const pos = new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
					const col = new THREE.Color().setHSL((i / this.nodeCount + Math.random() * 0.4) % 1.0, 0.95, 0.6);
					this.nodes.push({ pos: pos.clone(), base: pos.clone(), phase: Math.random() * Math.PI * 2, scale: 0.7 + Math.random() * 0.8 });
					dummy.position.copy(pos); dummy.scale.setScalar(this.nodes[i].scale); dummy.updateMatrix();
					this.nodeMesh.setMatrixAt(i, dummy.matrix); this.nodeMesh.setColorAt(i, col);
				}

				const edgeArr = [];
				for (let i = 0; i < this.nodeCount && edgeArr.length < this.edgeCount * 2; i++) {
					for (let j = i + 1; j < this.nodeCount && edgeArr.length < this.edgeCount * 2; j++) {
						if (this.nodes[i].base.distanceTo(this.nodes[j].base) < 6.0) edgeArr.push(i, j);
					}
				}
				this.edgeIndices = edgeArr;
				this.edgeGeo = new THREE.BufferGeometry();
				this.edgePositions = new Float32Array(this.edgeIndices.length * 3);
				this.edgeGeo.setAttribute('position', new THREE.BufferAttribute(this.edgePositions, 3));
				this.scene.add(new THREE.LineSegments(this.edgeGeo, new THREE.LineBasicMaterial({ color: 0x3a5080, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false })));

				this.packetMesh = new THREE.InstancedMesh(
					new THREE.SphereGeometry(0.08, 6, 4),
					new THREE.MeshBasicMaterial({ color: 0x63F2FF, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }),
					this.packetCount
				);
				this.scene.add(this.packetMesh);
				this.packets = [];
				for (let i = 0; i < this.packetCount; i++) {
					this.packets.push({ edge: Math.floor(Math.random() * (this.edgeIndices.length / 2)) * 2, progress: Math.random(), speed: 0.3 + Math.random() * 1.5 });
				}
			}
			update(time, dt) {
				const dummy = new THREE.Object3D();
				for (let i = 0; i < this.nodeCount; i++) {
					const n = this.nodes[i];
					n.pos.x = n.base.x + Math.sin(time * 1.2 + n.phase) * 0.07;
					n.pos.y = n.base.y + Math.cos(time * 0.9 + n.phase) * 0.05;
					n.pos.z = n.base.z + Math.sin(time * 1.0 + n.phase + 1) * 0.07;
					dummy.position.copy(n.pos);
					dummy.scale.setScalar(n.scale * (1 + Math.sin(time * 2 + n.phase) * 0.12));
					dummy.updateMatrix();
					this.nodeMesh.setMatrixAt(i, dummy.matrix);
				}
				this.nodeMesh.instanceMatrix.needsUpdate = true;

				for (let k = 0; k < this.edgeIndices.length; k++) {
					const n = this.nodes[this.edgeIndices[k]];
					this.edgePositions[k * 3] = n.pos.x;
					this.edgePositions[k * 3 + 1] = n.pos.y;
					this.edgePositions[k * 3 + 2] = n.pos.z;
				}
				this.edgeGeo.attributes.position.needsUpdate = true;

				for (let i = 0; i < this.packetCount; i++) {
					const p = this.packets[i];
					p.progress += p.speed * dt * 0.3;
					if (p.progress > 1) { p.edge = Math.floor(Math.random() * (this.edgeIndices.length / 2)) * 2; p.progress = 0; }
					const a = this.nodes[this.edgeIndices[p.edge]], b = this.nodes[this.edgeIndices[p.edge + 1]];
					if (a && b) {
						dummy.position.lerpVectors(a.pos, b.pos, p.progress);
						dummy.scale.setScalar(0.5 + 0.5 * Math.sin(p.progress * Math.PI));
						dummy.updateMatrix();
						this.packetMesh.setMatrixAt(i, dummy.matrix);
					}
				}
				this.packetMesh.instanceMatrix.needsUpdate = true;
			}
		}

		class InteractionManager {
			constructor(camera, renderer, controls, floorSystem, scene) {
				this.camera = camera;
				this.renderer = renderer;
				this.controls = controls;
				this.floorSystem = floorSystem;
				this.scene = scene;
				this.raycaster = new THREE.Raycaster();
				this.pointer = new THREE.Vector2();
				this.interactables = [];
				this.hovered = null;
				this.keys = {};
				this.moveSpeed = 9.0;
				this.boundary = { minX: -35, maxX: 35, minZ: -35, maxZ: 30 };

				renderer.domElement.addEventListener('pointermove', e => this.onPointerMove(e));
				renderer.domElement.addEventListener('click', e => this.onClick(e));
				renderer.domElement.addEventListener('dblclick', e => this.onDblClick(e));
				window.addEventListener('keydown', e => {
					if (document.getElementById('overlay')?.classList.contains('active')) return;
					this.keys[e.key.toLowerCase()] = true;
				});
				window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
			}
			registerInteractable(mesh, onClick) {
				mesh.userData.onClick = onClick;
				this.interactables.push(mesh);
			}
			onPointerMove(e) {
				this.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
				this.pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
				this.raycaster.setFromCamera(this.pointer, this.camera);
				const hits = this.raycaster.intersectObjects(this.interactables, false);
				if (this.hovered) this.hovered.userData.hovered = false;
				if (hits.length > 0) {
					this.hovered = hits[0].object;
					this.hovered.userData.hovered = true;
					this.renderer.domElement.classList.add('pointer-cursor');
				} else {
					this.hovered = null;
					this.renderer.domElement.classList.remove('pointer-cursor');
				}
			}
			onClick(e) {
				this.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
				this.pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
				this.raycaster.setFromCamera(this.pointer, this.camera);
				const objectHits = this.raycaster.intersectObjects(this.interactables, false);
				if (objectHits.length && objectHits[0].object.userData.onClick) {
					objectHits[0].object.userData.onClick(objectHits[0].object);
					return;
				}
				const floorHits = this.raycaster.intersectObject(this.floorSystem.mesh);
				if (floorHits.length) {
					this.floorSystem.addRipple(floorHits[0].point.x, floorHits[0].point.z, 0.6);
				}
			}
			onDblClick(e) {
				this.pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
				this.pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
				this.raycaster.setFromCamera(this.pointer, this.camera);
				const objectHits = this.raycaster.intersectObjects(this.interactables, false);
				if (objectHits.length && objectHits[0].object.userData.onDoubleClick) {
					objectHits[0].object.userData.onDoubleClick(objectHits[0].object);
					return;
				}
				const floorHits = this.raycaster.intersectObject(this.floorSystem.mesh);
				if (floorHits.length) {
					this.floorSystem.addBurst(floorHits[0].point.x, floorHits[0].point.z);
				}
			}
			updateMovement(dt) {
				if (document.getElementById('overlay')?.classList.contains('active')) {
					this.keys = {};
					return;
				}
				const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(this.camera.quaternion);
				forward.y = 0; forward.normalize();
				const right = new THREE.Vector3(1, 0, 0).applyQuaternion(this.camera.quaternion);
				right.y = 0; right.normalize();
				const move = new THREE.Vector3();
				if (this.keys['w'] || this.keys['arrowup']) move.add(forward);
				if (this.keys['s'] || this.keys['arrowdown']) move.sub(forward);
				if (this.keys['a'] || this.keys['arrowleft']) move.sub(right);
				if (this.keys['d'] || this.keys['arrowright']) move.add(right);
				if (move.length() > 0) {
					move.normalize().multiplyScalar(this.moveSpeed * dt);
					this.camera.position.add(move);
					this.camera.position.x = Math.max(this.boundary.minX, Math.min(this.boundary.maxX, this.camera.position.x));
					this.camera.position.z = Math.max(this.boundary.minZ, Math.min(this.boundary.maxZ, this.camera.position.z));
					this.controls.target.add(move);
					this.controls.update();
				}
			}
		}

		
function adaptModalGrids(mode) {
	const effectiveMode = mode || (window.GBNfoData && GBNfoData.settings && GBNfoData.settings.CardLayoutMode) || 'balanced';
	const isNarrowOrPortrait = window.innerWidth <= 640 || (window.matchMedia && window.matchMedia('(orientation: portrait) and (max-width: 768px)').matches);
	const grids = document.querySelectorAll('#panel .cards');
	grids.forEach(grid => {
		const items = Array.from(grid.children).filter(el => el.nodeType === 1);
		grid.classList.remove('grid-center-last');
		items.forEach(el => {
			el.classList.remove('card-span-2', 'card-span-3', 'card-span-full');
			el.style.gridColumn = '';
		});
		if (!items.length || isNarrowOrPortrait) return;
		if (effectiveMode === 'center') {
			grid.classList.add('grid-center-last');
			return;
		}
		const style = getComputedStyle(grid);
		if (style.display !== 'grid') return;
		const tracks = style.gridTemplateColumns.trim().split(/\s+(?![^()]*\))/).filter(t => t && t !== 'none');
		const cols = tracks.length || Math.max(1, Math.floor((grid.getBoundingClientRect().width + 16) / 266));
		if (cols <= 1) return;

		const targets = items.length < cols ? items : (items.length % cols ? items.slice(-(items.length % cols)) : []);
		if (!targets.length) return;
		if (effectiveMode === 'lone-full' && targets.length !== 1) return;

		if (cols % targets.length === 0) {
			const evenSpan = Math.min(cols / targets.length, cols);
			if (evenSpan > 1) {
				targets.forEach(el => {
					if (evenSpan >= cols) el.classList.add('card-span-full');
					else if (evenSpan === 3) el.classList.add('card-span-3');
					else if (evenSpan === 2) el.classList.add('card-span-2');
				});
			}
			return;
		}

		const base = Math.floor(cols / targets.length);
		let rem = cols % targets.length;
		targets.forEach(el => {
			const span = Math.min(base + (rem > 0 ? 1 : 0), cols);
			if (rem > 0) rem--;
			if (span >= cols) el.classList.add('card-span-full');
			else if (span === 3) el.classList.add('card-span-3');
			else if (span === 2) el.classList.add('card-span-2');
		});
	});
}

			updateFormulaBoard(time) {
				if (!this.formulaBoard) return;
				const formulas = [
					{ lines: ['Black-Scholes-Merton:', 'C = S N(d1) - K e^{-rt} N(d2)', 'd1 = [ln(S/K)+(r+σ²/2)t] / σ√t', 'd2 = d1 - σ√t'] },
					{ lines: ['SABR Stochastic Volatility:', 'dF = α F^β dW1', 'dα = να dW2', 'corr(dW1,dW2)=ρ'] },
					{ lines: ['Heston Model:', 'dS = μSdt + √v S dW1', 'dv = κ(θ-v)dt + ξ√v dW2', 'corr(dW1,dW2)=ρ'] },
					{ lines: ['Hull-White One-Factor:', 'dr = [θ(t) - a r]dt + σ dW', 'P(t,T) = A(t,T) exp(-B(t,T) r_t)', 'mean reversion · short-rate lattice'] },
					{ lines: ['Dupire Local Volatility:', '∂C/∂T = 0.5 σ²(K,T) K² ∂²C/∂K²', 'σ²(K,T) = [∂C/∂T] / [0.5K²∂²C/∂K²]', 'surface → local dynamics'] }
				];
				const cycle = 9.2, total = formulas.length * cycle, u = (time % total) / cycle;
				const idx = Math.floor(u), phase = u - idx;
				const key = idx + ':' + Math.floor(phase * 64);
				if (key === this.formulaBoard.lastKey) return;
				this.formulaBoard.lastKey = key;

				const c = this.formulaBoard.canvas, x = this.formulaBoard.ctx;
				x.fillStyle = '#07160f'; x.fillRect(0, 0, c.width, c.height);
				x.strokeStyle = 'rgba(255,255,255,.28)'; x.lineWidth = 8; x.strokeRect(16, 16, 992, 480);

				const reveal = phase < .58 ? phase / .58 : (phase < .78 ? 1 : Math.max(0, 1 - (phase - .78) / .22));
				const all = formulas[idx].lines.join('\n');
				const visible = all.slice(0, Math.floor(all.length * reveal)).split('\n');
				visible.forEach((line, i) => {
					x.font = i === 0 ? 'italic 34px Playfair Display' : '34px Roboto Mono';
					x.fillStyle = i === 0 ? '#FFBE0B' : 'rgba(255,255,255,.9)';
					x.fillText(line, 58, 86 + i * 62);
				});
				x.font = 'italic 26px Playfair Display';
				x.fillStyle = '#63F2FF';
				x.fillText('Click chalkboard to open Technical Notes & Papers', 58, 452);
				this.formulaBoard.tex.needsUpdate = true;
			}
			animate() {
				requestAnimationFrame(() => this.animate());
				const dt = Math.min(this.clock.getDelta(), 0.1);
				const t = performance.now() * 0.001;

				this.controls.update();
				this.interactionManager.updateMovement(dt);
				this.floorSystem.update(t, dt);
				this.ceilingSystem.update(t, dt);
				this.updateFormulaBoard(t);
				this.announcementSystem?.update(t);
				this.scenicBackdrop?.update(t);

				this.movers?.forEach(m => {
					const g = m.group;
					if (!g.visible) return;
					m.change -= dt;
					if (m.change <= 0) {
						m.dir.set(Math.random() - .5, 0, Math.random() - .5).normalize();
						m.change = 1.0 + Math.random() * 2.2;
					}
					g.position.addScaledVector(m.dir, m.speed * dt);
					if (g.position.x < -16 || g.position.x > 16) m.dir.x *= -1;
					if (g.position.z < -8 || g.position.z > 10) m.dir.z *= -1;
					g.rotation.y = m.forwardAxis === 'x' ? Math.atan2(-m.dir.z, m.dir.x) : Math.atan2(m.dir.x, m.dir.z);
				});

				this.flyers?.forEach((f, i) => {
					f.angle += dt * f.speed;
					f.group.position.set(Math.cos(f.angle) * f.radius, f.height + Math.sin(t * f.wobble + i) * f.wobbleAmp, Math.sin(f.angle) * f.radius + f.zOffset);
					f.group.rotation.y = -f.angle + Math.PI / 2;
				});

				this.fallers?.forEach(sp => {
					sp.position.y -= sp.userData.speed;
					if (sp.position.y < -2) {
						sp.position.y = 24;
						sp.position.x = (Math.random() - 0.5) * 44;
						sp.position.z = (Math.random() - 0.5) * 50;
					}
				});

				this.composer.render();
			}
		}

		});
	
/* === Patch All Override: 3D Modal 2-Card Centering, 3-Card Equal Row & Icon Safety === */
(function () {
	const origModalAdapt = window.adaptModalGrids;

	function sanitizeModalIcons() {
		document.querySelectorAll('#panel .cards .ico').forEach(ico => {
			if (ico.querySelector('i')) return;
			const txt = (ico.textContent || '').trim();
			if (!txt || txt === '\uFFFD' || txt === '?') {
				ico.innerHTML = '<i class="fas fa-microchip"></i>';
			}
		});
	}

	window.adaptModalGrids = function (mode) {
		const isPortraitPhone =
			window.matchMedia && window.matchMedia('(orientation: portrait) and (max-width: 768px)').matches;
		const isDesktopEqual3 = window.innerWidth > 900 && !isPortraitPhone;
		const isDesktopCentered2 = window.innerWidth > 720 && !isPortraitPhone;

		document.querySelectorAll('#panel .cards').forEach(grid => {
			grid.classList.remove('cols-equal-3', 'cards-centered-2');
			const items = Array.from(grid.children).filter(el => el.nodeType === 1);
			if (items.length === 3 && isDesktopEqual3) {
				grid.classList.add('cols-equal-3');
			} else if (items.length === 2 && isDesktopCentered2) {
				grid.classList.add('cards-centered-2');
			}
		});

		if (typeof origModalAdapt === 'function') {
			origModalAdapt(mode);
		}

		document.querySelectorAll('#panel .cards').forEach(grid => {
			const items = Array.from(grid.children).filter(el => el.nodeType === 1);
			if (grid.classList.contains('cols-equal-3') || grid.classList.contains('cards-centered-2')) {
				grid.classList.remove('grid-center-last');
				items.forEach(el => {
					el.classList.remove('card-span-2', 'card-span-3', 'card-span-full');
					el.style.gridColumn = '';
				});
			}
		});

		sanitizeModalIcons();
	};
})();
</script>
