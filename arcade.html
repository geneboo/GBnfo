<style>
:root{--primary:#ff006e;--secondary:#3a86ff;--accent:#ffbe0b;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 15%,#22133f 0,transparent 34%),radial-gradient(circle at 85% 24%,#062953 0,transparent 34%),#05050b;color:white;font-family:Inter,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 18px)}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4%;background:rgba(5,5,11,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.14)}header a,header button{border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;padding:10px 15px;font-weight:800;text-decoration:none;cursor:pointer}.brand{font-family:Orbitron;font-weight:900;letter-spacing:1px}.brand span{color:var(--accent)}main{width:min(1180px,94vw);margin:28px auto 60px}.hero{text-align:center;margin:28px 0}.hero h1{font:900 clamp(2.2rem,7vw,5rem) Orbitron;margin:0;background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary));-webkit-background-clip:text;color:transparent}.hero p{color:#bac4dc}.arcade-toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 24px}.arcade-toolbar button,.game-launch,.arcbtn,.drumpad{border:1px solid rgba(255,255,255,.22);border-radius:999px;background:linear-gradient(135deg,rgba(255,0,110,.25),rgba(58,134,255,.28));color:#fff;padding:10px 16px;font-weight:800;cursor:pointer}.arcade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.arcade-card{padding:17px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 32px rgba(0,0,0,.25)}.arcade-card h3{font-family:Orbitron;font-size:1rem}.arcade-card p{color:#b8c1d8;font-size:.82rem;min-height:42px}.arcade-best{color:var(--accent);font-size:.76rem;margin:10px 0}.modal-title,.arcade-lobby-title{font:900 clamp(1.6rem,5vw,3rem) Orbitron}.modal-subtitle{color:#abb6d1;margin:8px 0 18px}.modal-body{line-height:1.6}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{color:#fff;border:1px solid #667;padding:8px 12px;border-radius:999px}.lbtable{width:100%;border-collapse:collapse;margin:12px 0 24px}.lbtable th,.lbtable td{padding:9px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}.arcade canvas,.gamecanvas{max-width:100%;display:block;margin:auto;background:#05050a;border:1px solid #445}.hudrow,.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.padgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.piano{position:relative;display:flex;justify-content:center;min-height:190px}.whitekey{width:42px;height:180px;background:#fff;color:#111;border:1px solid #333}.blackkey{position:absolute;width:28px;height:112px;background:#111;color:#fff;z-index:2}#inner{min-height:400px}.back-row{margin-bottom:16px}#status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:#111a;border:1px solid #ffffff22;color:#cbd4e8;font-size:.75rem;z-index:50}@media(max-width:600px){header{flex-wrap:wrap}.padgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<header><div class="brand">GENE'S <span>ARCADE</span></div><nav><a href="index.html"><i class="fas fa-house"></i> Portfolio</a><a href="index3d.html"><i class="fas fa-cube"></i> 3D Office</a></nav></header>
<main id="arcade-root"><section class="hero"><h1>AFTER-HOURS ARCADE</h1><p>Sixteen games, shared local leaderboards, synths, drums and secrets.</p></section><div id="inner"></div></main><div id="status">Loading arcade…</div>
<script type="module">
import { createArcadePortal } from './arcade-games.js';
const content=document.getElementById('inner');
const status=document.getElementById('status');
const root=document.getElementById('arcade-root');
const portal=createArcadePortal({overlay:root,inner:content,closeButton:null,hint:null,onOpen(){status.textContent='Arcade ready';},onClose(){portal.openLobby();}});
try { portal.openLobby(); status.textContent='Arcade ready'; setTimeout(()=>status.remove(),1800); } catch (err) { console.error(err); status.textContent='Arcade failed: '+err.message; status.style.color='#ff809f'; }
window.arcadePortal=portal;
</script>
</body></html>
